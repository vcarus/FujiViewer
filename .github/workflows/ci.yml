name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      # Fixtures are synthetic and generated into a temporary directory, so the runner needs no
      # photos of its own.
      - name: Test
        run: swift test
