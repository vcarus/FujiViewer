name: Release

on:
  push:
    # Version tags only. A bare 'v*' also matches a tag like 'vendor-sync', which would strip to
    # the version "endor-sync" and publish it as a real release. (Actions globs do not cross '/',
    # so a tag like v1/rc1 cannot reach this workflow at all.)
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      # The image default is Xcode 16.4, whose SwiftPM fails a multi-arch build of this package:
      # `.swiftLanguageMode(.v5)` does not reach SWIFT_VERSION and the two slices collide on output
      # paths. Pinning also keeps a release from being built by whatever Xcode the image defaults to
      # that week. When the image drops this version the build fails loudly, which is the point.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Toolchain
        run: swift --version

      # Never ship a build whose tests fail.
      - name: Test
        run: swift test

      - name: Build universal app
        run: FUJIVIEWER_VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh --universal

      - name: Verify both architectures are present
        run: |
          archs="$(lipo -archs FujiViewer.app/Contents/MacOS/FujiViewer)"
          echo "architectures: $archs"
          for arch in x86_64 arm64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "error: $arch is missing from the binary" >&2; exit 1 ;;
            esac
          done

      # ditto preserves the bundle structure and the ad-hoc signature; zip would not.
      - name: Package
        run: |
          ditto -c -k --keepParent FujiViewer.app "FujiViewer-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "FujiViewer-${GITHUB_REF_NAME}.zip" > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "FujiViewer-${GITHUB_REF_NAME}.zip" \
            checksums.txt \
            --generate-notes
